
#Define how your data should be created when application restarts
spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.datasource.url=jdbc:mysql://localhost:3306/teacloud
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=root

#Thymeleaf Things
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.basename=messages
spring.thymeleaf.cache=false
logging.level.org.thymeleaf=DEBUG


#DevTools to Ease the development
spring.devtools.livereload.enabled=true


#Logging Configuration
logging.level.root=INFO
logging.level.org.springframework=DEBUG
logging.level.com.teaCloud=TRACE