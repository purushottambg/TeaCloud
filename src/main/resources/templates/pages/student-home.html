<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <script th:src="@{/script.js}"></script>
    <title>TeaCloud Home</title>
</head>
<body>

<div th:insert="~{/fixedcont/header}">
    <!--This is part reserved for the header-->
</div>


<div>
    <div th:if="${logInDTO1}" th:object="${logInDTO1}">
        <h2>This is your Home!!</h2>
        <a th:text="*{memberID}"></a>
        <a th:text="*{password}"></a>
    </div>

    <h2 th:if="${failed}" th:text="#{failed}"></h2>
</div>



<div th:insert="~{/fixedcont/footer}">
    <!-- Footer must be declared here -->
</div>

</body>
</html>
